site_name: Family Cookbook
site_description: A searchable collection of family recipes extracted from cookbooks, magazines, and handwritten cards
# Set to your GitHub Pages URL, e.g. https://scottsaenz.github.io/family_cookbook
site_url: "https://scottsaenz.github.io/family_cookbook"

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - toc.integrate
  icon:
    logo: material/silverware-fork-knife
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      separator: '[\s\-\.]+'
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - tables

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Recipes: recipes/index.md
  - Tags: tags.md
